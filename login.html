<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Login | Ana Beatriz</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="card">

    <h2>Login</h2>

    <form id="loginForm">

      <label>Email</label>
      <input 
        type="email" 
        name="email" 
        required 
        placeholder="seu@email.com"
      >

      <label>Senha</label>
      <input 
        type="password" 
        name="senha" 
        required 
        placeholder="****"
      >

      <button type="submit">
        Entrar
      </button>

    </form>

  </div>


  <script>

    // ========================================
    // USUÁRIOS PERMITIDOS
    // ========================================
    // Como o GitHub Pages não roda servidor/banco de dados,
    // a verificação é feita aqui no navegador.
    // Troque/adicione os usuários abaixo conforme quiser.

    const USUARIOS = [
      { email: 'anab@email.com', senha: '1234' },
      { email: 'admin@email.com', senha: '1234' }
    ];


    document.getElementById('loginForm').addEventListener('submit', function (event) {

      event.preventDefault();

      const email = document.querySelector('input[name="email"]').value.trim().toLowerCase();
      const senha = document.querySelector('input[name="senha"]').value;

      const usuarioValido = USUARIOS.some(
        u => u.email === email && u.senha === senha
      );

      if (usuarioValido) {

        // marca a sessão como logada (auth.js verifica isso nas outras páginas)
        sessionStorage.setItem('logado', 'sim');

        window.location.href = 'index.html';

      } else {

        alert('Email ou senha incorretos!');

      }

    });

  </script>

</body>

</html>
